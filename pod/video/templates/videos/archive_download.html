{% extends 'base.html' %}
{% load i18n %}
{% block page_content %}
    <div class="list-group">
        <fieldset>
            <legend>{% trans "Archive Download" %}</legend>
            <div class="list-group-item">
                <div class="form-group form-group-required ">
                    <div>{% trans "The download gonna start." %}</div>
                    <small id="id_agreeHelp" class="form-text">{% trans "Please Wait." %}</small>
                </div>
            </div>
        </fieldset>
    </div>

    <div class="text-center mt-1">
        <a href="/video/respit/{{ slug }}/" class="btn btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom">
            {% trans "Back to choices" %}
        </a>
        <a href="/" class="btn btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="bottom">
            {% trans "Return to homepage." %}
        </a>
    </div>

    <meta http-equiv="refresh" content="0; URL={{ url }}" />
{% endblock page_content %}
