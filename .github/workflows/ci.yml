name: Pod V5 CI/CD

on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - run: |
          pip install -r requirements.txt
          pip install flake8 black

      - name: Format code with Black
        if: >-
          github.ref_name != 'main' && github.ref_name != 'dev_v5' &&
          github.actor != 'dependabot[bot]'
        run: black . -l 90

      - name: Commit formatted code
        if: >-
          github.ref_name != 'main' && github.ref_name != 'dev_v5' &&
          github.actor != 'dependabot[bot]'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: Auto-format code with Black"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Check formatting
        run: black . -l 90 --check --diff

      - run: flake8 src --count --show-source --statistics
      - run: python scripts/check_pydocs.py

  test-docker-full:
    needs: [quality-check]
    if: github.repository == 'EsupPortail/Esup-Pod'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.sha }}
      DJANGO_SETTINGS_MODULE: config.django.dev.docker
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create .env file
        run: cp .env.example .env

      - name: Pre-pull Docker images with retries
        run: |
          ok=0
          for i in {1..5}; do
            echo "Attempt $i to pull images..."
            timeout 60s docker pull ghcr.io/esupportail/esup-runner-manager:latest && \
            timeout 60s docker pull ghcr.io/esupportail/esup-runner-runner:latest && { ok=1; break; }
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo "Image pull failed"; exit 1; }

      - name: Build Stack
        run: make build

      - name: Start Stack
        run: make start

      - name: Wait for Services
        run: |
          set -e
          echo "Waiting for API..."
          # Retry loop to wait for API to be ready
          count=0
          until curl -sf http://127.0.0.1:8000/api/docs/ > /dev/null || [ $count -eq 60 ]; do
             echo "Waiting for API... ($count/60)"
             sleep 2
             count=$((count+1))
          done

          if [ $count -eq 60 ]; then
            echo "API failed to start"
            make logs
            exit 1
          fi

      - name: Run Tests with Coverage (Inside Docker)
        run: make test-cov

      - name: Install E2E dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run Smoke & E2E Tests
        # Runs against the running docker container from the host
        run: python src/config/django/test/e2e_scenario.py

      - name: Basic Load Test
        run: seq 50 | xargs -P 50 -I{} curl -sf http://127.0.0.1:8000/api/docs/ -o /dev/null

      - name: Teardown
        if: always()
        run: make clean