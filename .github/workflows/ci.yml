name: Pod V5 CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev_v5
      - main

jobs:
  # 1. Code Quality
  quality-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 black

      - name: Format code with Black
        run: |
          black . -l 90

      - name: Commit formatted code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: Auto-format code with Black"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Lint with flake8
        run: flake8 src --count --show-source --statistics

      - name: Run PyDoc Audit
        run: python scripts/check_pydocs.py

      - name: Create .env file
        run: cp .env.example .env

  # 2. Docker Integration, E2E & Security (The Authoritative Test)
  test-docker-full:
    needs: [quality-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create .env file
        run: cp .env.example .env

      - name: Pre-pull Docker images with retries
        run: |
          for i in {1..5}; do
            echo "Attempt $i to pull images..."
            timeout 60s docker pull ghcr.io/esupportail/esup-runner-manager:latest && \
            timeout 60s docker pull ghcr.io/esupportail/esup-runner-runner:latest && \
            break || sleep 10
          done

      - name: Build Stack
        env:
          VERSION: ${VERSION}
          DJANGO_SETTINGS_MODULE: config.django.dev.docker
        run: make build

      - name: Start Stack
        env:
          VERSION: ${VERSION}
          DJANGO_SETTINGS_MODULE: config.django.dev.docker
        run: make start

      - name: Wait for Services
        run: |
          set -e
          echo "Waiting for API..."
          # Retry loop to wait for API to be ready
          count=0
          until curl -sf http://127.0.0.1:8000/api/docs/ > /dev/null || [ $count -eq 60 ]; do
             echo "Waiting for API... ($count/60)"
             sleep 2
             count=$((count+1))
          done

          if [ $count -eq 60 ]; then
            echo "API failed to start"
            make logs
            exit 1
          fi

      - name: Run Tests with Coverage (Inside Docker)
        run: make test-cov

      - name: Install E2E dependencies
        run: |
          pip install --upgrade pip
          pip install requests

      - name: Run Smoke & E2E Tests
        # Runs against the running docker container from the host
        run: python src/config/django/test/e2e_scenario.py

      - name: Run API Curl Tests (Per App)
        run: make test-api-curl

      - name: Basic Load Test
        run: |
          fail=0
          for i in {1..50}; do
            curl -sf http://127.0.0.1:8000/api/docs/ > /dev/null || fail=1 &
          done
          wait
          if [ "$fail" -ne 0 ]; then
            echo "Load test failed"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: make clean
