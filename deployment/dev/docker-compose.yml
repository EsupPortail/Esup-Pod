services:
  db:
    image: mariadb:10.11
    container_name: pod-v5-api-db-${VERSION:-dev}
    env_file:
      - ../../.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - pod_db_data_dev:/var/lib/mysql
      - ./init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql
    healthcheck:
      test: ["CMD", "scripts/healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      pod-network:
        aliases:
          - db

  api:
    build:
      context: ../../
      dockerfile: deployment/dev/Dockerfile
    container_name: "pod-v5-api-${VERSION:-dev}"
    volumes:
      - ../../:/app
      - ../../media:/app/media
    ports:
      - "${EXPOSITION_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_started
    env_file:
      - ../../.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DJANGO_SETTINGS_MODULE: config.django.dev.docker
      ALLOWED_HOSTS: "*"
      SERVICE_LABEL: api
    command: ["run-server"]
    networks:
      pod-network:
        aliases:
          - api
  redis:
    image: redis:7
    container_name: pod-v5-api-redis-${VERSION:-dev}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - pod_redis_data_dev:/data
    networks:
      pod-network:
        aliases:
          - redis

  celery:
    build:
      context: ../../
      dockerfile: deployment/dev/Dockerfile
    container_name: "pod-v5-api-celery-${VERSION:-dev}"
    volumes:
      - ../../:/app
      - ../../media:/app/media
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - ../../.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      DJANGO_SETTINGS_MODULE: config.django.dev.docker
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SERVICE_LABEL: celery
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    networks:
      pod-network:
        aliases:
          - celery

  manager:
    build:
      context: ../../
      dockerfile: deployment/dev/Dockerfile.esup-runner
      target: manager
    container_name: pod-v5-manager-${VERSION:-dev}
    ports:
      - "8081:8081"
    networks:
      pod-network:
        aliases:
          - manager

  runner:
    build:
      context: ../../
      dockerfile: deployment/dev/Dockerfile.esup-runner
      target: runner
    container_name: pod-v5-runner-${VERSION:-dev}
    depends_on:
      - manager
    networks:
      pod-network:
        aliases:
          - runner

networks:
  pod-network:
    driver: bridge

volumes:
  pod_db_data_dev:
  pod_redis_data_dev:
